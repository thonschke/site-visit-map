<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Site Visit Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --ink: #0F1B2D;
    --surface: #16263D;
    --surface-line: #2A3B54;
    --paper: #EDEFF2;
    --paper-dim: #A8B4C4;
    --accent: #F5A623;

    --c-fresh: #2FA88A;
    --c-week1: #F5C244;
    --c-week2: #E8790C;
    --c-week3: #D0392B;
    --c-unvisited: #6B7A8F;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 480px;
  }

  #map {
    position: absolute;
    inset: 0;
  }

  .header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: linear-gradient(to bottom, rgba(15,27,45,0.92), rgba(15,27,45,0));
    pointer-events: none;
  }

  .header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .header .count {
    color: var(--paper-dim);
    font-size: 13px;
  }

  .legend {
    position: absolute;
    bottom: 22px;
    left: 18px;
    z-index: 500;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: 4px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.9;
    min-width: 168px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: 0 0 auto;
  }

  .status {
    position: absolute;
    inset: 0;
    z-index: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
  }

  .status-box {
    max-width: 380px;
  }

  .status-box h2 {
    font-size: 16px;
    margin: 0 0 8px;
    font-weight: 600;
  }

  .status-box p {
    margin: 0;
    color: var(--paper-dim);
    font-size: 14px;
    line-height: 1.5;
  }

  .status-box code {
    display: block;
    margin-top: 12px;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--accent);
    word-break: break-all;
    text-align: left;
  }

  .leaflet-popup-content-wrapper {
    background: var(--surface);
    color: var(--paper);
    border-radius: 4px;
  }
  .leaflet-popup-tip { background: var(--surface); }
  .leaflet-popup-content a { color: var(--accent); }
  .popup-title { font-weight: 600; margin-bottom: 2px; }
  .popup-priority { color: var(--paper-dim); font-size: 12px; margin-bottom: 6px; }

  .filter-toggle {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    color: var(--paper);
    border-radius: 4px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .filter-toggle:hover { border-color: var(--accent); }
  .filter-badge {
    background: var(--accent);
    color: var(--ink);
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    padding: 1px 6px;
    display: none;
  }

  .filter-panel {
    position: absolute;
    top: 58px;
    right: 18px;
    z-index: 600;
    width: 260px;
    max-height: calc(100vh - 90px);
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: 4px;
    padding: 4px 14px 14px;
    display: none;
  }
  .filter-panel.open { display: block; }

  .filter-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0 6px;
    position: sticky;
    top: 0;
    background: var(--surface);
  }
  .filter-panel-header h3 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
  }
  .clear-filters {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    padding: 0;
  }

  .filter-group summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 0;
    list-style: none;
  }
  .filter-group summary::-webkit-details-marker { display: none; }
  .filter-group summary::before {
    content: "▸";
    display: inline-block;
    margin-right: 6px;
    color: var(--paper-dim);
  }
  .filter-group[open] summary::before { content: "▾"; }

  .filter-option {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 4px 0 4px 18px;
    color: var(--paper-dim);
  }
  .filter-option input { accent-color: var(--accent); }
</style>
</head>
<body>

<div id="app">
  <div id="map"></div>

  <div class="header">
    <h1>Site visits</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="count" id="pointCount"></span>
      <button class="filter-toggle" id="filterToggle">
        Filters <span class="filter-badge" id="filterBadge">0</span>
      </button>
    </div>
  </div>

  <div class="filter-panel" id="filterPanel">
    <div class="filter-panel-header">
      <h3>Filter sites</h3>
      <button class="clear-filters" id="clearFilters">Clear all</button>
    </div>
    <div id="filterGroups"></div>
  </div>

  <div class="legend" id="legend" style="display:none;"></div>

  <div class="status" id="status">
    <div class="status-box">
      <h2>Loading site visits…</h2>
      <p>Pulling the latest data from the reports database.</p>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ---- CONFIG -----------------------------------------------------------
  // Raw URL of the GitHub Gist that publishMapData keeps updated. Format:
  // https://gist.githubusercontent.com/USERNAME/GIST_ID/raw/FILENAME
  // (grab the exact URL from the gist page's "Raw" button on the file).
  const MAP_DATA_URL = "https://gist.githubusercontent.com/thonschke/9836a09704d9b338a76c6ad413912d32/raw/map-data.json";

  // Center the map roughly over your service area on first load.
  const DEFAULT_CENTER = [39.5, -75.5];
  const DEFAULT_ZOOM = 8;

  // How often the map re-fetches data on its own, in milliseconds.
  // No need to poll faster than publishMapData actually republishes.
  const REFRESH_INTERVAL_MS = 2 * 60 * 1000; // 2 minutes
  // -------------------------------------------------------------------------

  const PRIORITY_COLORS = {
    "< 1 week": "#2FA88A",
    "More than 1 week": "#F5C244",
    "More than 2 weeks": "#E8790C",
    "More than 3 weeks": "#D0392B",
    "Not Visited": "#6B7A8F",
  };
  const PRIORITY_ORDER = [
    "< 1 week",
    "More than 1 week",
    "More than 2 weeks",
    "More than 3 weeks",
    "Not Visited",
  ];

  // Filter categories shown in the panel. `getValues` returns an array since
  // a point can match more than one value in a category (e.g. multiple
  // trades on one report) — a point passes a category filter if it has ANY
  // selected value in that category. Categories combine with AND.
  const FILTER_DEFS = [
    { key: "priority", label: "Visit priority", getValues: (p) => [p.priority || "Unknown"], fixedOptions: PRIORITY_ORDER },
    { key: "trades", label: "Trade", getValues: (p) => (p.trades && p.trades.length ? p.trades : ["None listed"]) },
    { key: "status", label: "Status of project", getValues: (p) => (p.status && p.status.length ? p.status : ["Unknown"]) },
    { key: "publicOrPrivate", label: "Public / private", getValues: (p) => (p.publicOrPrivate && p.publicOrPrivate.length ? p.publicOrPrivate : ["Unknown"]) },
    { key: "unionStatus", label: "Union status", getValues: (p) => (p.unionStatus && p.unionStatus.length ? p.unionStatus : ["Unknown"]) },
    { key: "state", label: "State", getValues: (p) => (p.state && p.state.length ? p.state : ["Unknown"]) },
    { key: "county", label: "County", getValues: (p) => (p.county && p.county.length ? p.county : ["Unknown"]) },
  ];

  const activeFilters = {};
  FILTER_DEFS.forEach((def) => (activeFilters[def.key] = new Set()));

  const statusEl = document.getElementById("status");
  const legendEl = document.getElementById("legend");
  const countEl = document.getElementById("pointCount");
  const filterToggleEl = document.getElementById("filterToggle");
  const filterPanelEl = document.getElementById("filterPanel");
  const filterGroupsEl = document.getElementById("filterGroups");
  const filterBadgeEl = document.getElementById("filterBadge");
  const clearFiltersEl = document.getElementById("clearFilters");

  function showError(title, detail) {
    statusEl.style.display = "flex";
    statusEl.innerHTML = `
      <div class="status-box">
        <h2>${title}</h2>
        <p>${detail}</p>
      </div>
    `;
  }

  function renderLegend(presentPriorities) {
    legendEl.innerHTML = PRIORITY_ORDER
      .filter((p) => presentPriorities.has(p))
      .map(
        (p) => `
          <div class="legend-row">
            <span class="legend-dot" style="background:${PRIORITY_COLORS[p]}"></span>
            <span>${p}</span>
          </div>`
      )
      .join("");
    legendEl.style.display = "block";
  }

  function buildFilterPanel(points) {
    filterGroupsEl.innerHTML = FILTER_DEFS.map((def) => {
      const seen = new Set(def.fixedOptions || []);
      points.forEach((p) => def.getValues(p).forEach((v) => seen.add(v)));
      const options = Array.from(seen).sort();

      const rows = options
        .map((opt) => {
          const id = `f-${def.key}-${opt.replace(/[^a-z0-9]/gi, "_")}`;
          const checked = activeFilters[def.key].has(opt) ? "checked" : "";
          return `
            <label class="filter-option" for="${id}">
              <input type="checkbox" id="${id}" data-key="${def.key}" data-value="${escapeHtml(opt)}" ${checked} />
              ${escapeHtml(opt)}
            </label>`;
        })
        .join("");

      return `
        <details class="filter-group">
          <summary>${escapeHtml(def.label)}</summary>
          ${rows}
        </details>`;
    }).join("");

    filterGroupsEl.querySelectorAll("input[type=checkbox]").forEach((input) => {
      input.addEventListener("change", () => {
        const { key, value } = input.dataset;
        if (input.checked) {
          activeFilters[key].add(value);
        } else {
          activeFilters[key].delete(value);
        }
        updateFilterBadge();
        applyFilters();
      });
    });
  }

  function updateFilterBadge() {
    const total = Object.values(activeFilters).reduce((sum, set) => sum + set.size, 0);
    filterBadgeEl.textContent = String(total);
    filterBadgeEl.style.display = total > 0 ? "inline-block" : "none";
  }

  function pointMatchesFilters(point) {
    return FILTER_DEFS.every((def) => {
      const selected = activeFilters[def.key];
      if (selected.size === 0) return true; // no filter set in this category = show all
      const values = def.getValues(point);
      return values.some((v) => selected.has(v));
    });
  }

  function applyFilters() {
    const filtered = allPoints.filter(pointMatchesFilters);
    renderPoints(filtered, { isFiltered: activeFilters && Object.values(activeFilters).some((s) => s.size > 0) });
  }

  filterToggleEl.addEventListener("click", () => {
    filterPanelEl.classList.toggle("open");
  });

  clearFiltersEl.addEventListener("click", () => {
    FILTER_DEFS.forEach((def) => activeFilters[def.key].clear());
    filterGroupsEl.querySelectorAll("input[type=checkbox]").forEach((input) => (input.checked = false));
    updateFilterBadge();
    applyFilters();
  });

  let allPoints = [];
  let map = null;
  let markersLayer = null;
  let hasFitBoundsOnce = false;

  async function fetchPoints() {
    const res = await fetch(`${MAP_DATA_URL}?t=${Date.now()}`); // cache-bust so we don't see a stale cached copy right after a scheduled update
    if (!res.ok) {
      throw new Error(`Server responded with status ${res.status}`);
    }
    return (await res.json()) || [];
  }

  function renderPoints(points, { isFiltered } = {}) {
    markersLayer.clearLayers();

    const bounds = [];
    const presentPriorities = new Set();

    points.forEach((point) => {
      const known = Boolean(PRIORITY_COLORS[point.priority]);
      const color = known ? PRIORITY_COLORS[point.priority] : PRIORITY_COLORS["Not Visited"];
      presentPriorities.add(known ? point.priority : "Not Visited");

      const marker = L.circleMarker([point.lat, point.lng], {
        radius: 7,
        color: color,
        fillColor: color,
        fillOpacity: 0.85,
        weight: 1.5,
      });

      marker.bindPopup(`
        <div class="popup-title">${escapeHtml(point.name || "Untitled")}</div>
        <div class="popup-priority">${escapeHtml(point.priority || "Unknown")}</div>
        ${point.url ? `<a href="${point.url}" target="_blank" rel="noopener">Open in Notion</a>` : ""}
      `);

      marker.addTo(markersLayer);
      bounds.push([point.lat, point.lng]);
    });

    countEl.textContent = isFiltered
      ? `${points.length} of ${allPoints.length} sites`
      : `${points.length} site${points.length === 1 ? "" : "s"}`;
    renderLegend(presentPriorities);

    // Only auto-fit the view the FIRST time points load — on later refreshes
    // or filter changes, leave the view alone so we don't yank the map out
    // from under someone who's currently panned/zoomed in on an area.
    if (!hasFitBoundsOnce && bounds.length > 0) {
      if (bounds.length > 1) {
        map.fitBounds(bounds, { padding: [40, 40] });
      } else {
        map.setView(bounds[0], 13);
      }
      hasFitBoundsOnce = true;
    }
  }

  async function refreshData({ isInitialLoad } = {}) {
    let points;
    try {
      points = await fetchPoints();
    } catch (err) {
      if (isInitialLoad) {
        showError(
          "Couldn't load site visits",
          `The map couldn't reach the data source. Details: ${err.message}`
        );
      } else {
        // Don't blow away an already-working map over a transient refresh
        // failure — just note it quietly and try again next interval.
        console.warn("Map refresh failed:", err);
      }
      return;
    }

    if (isInitialLoad && points.length === 0) {
      showError(
        "No site visits to show",
        "The data source returned no records with a location set."
      );
      return;
    }

    if (isInitialLoad) {
      statusEl.style.display = "none";
    }

    allPoints = points;
    buildFilterPanel(allPoints); // rebuild options in case new values showed up
    applyFilters();
  }

  async function loadMap() {
    if (!MAP_DATA_URL || MAP_DATA_URL.startsWith("REPLACE_WITH")) {
      showError(
        "Map data URL not set",
        "Open this file and set MAP_DATA_URL to the gist's raw URL."
      );
      return;
    }

    map = L.map("map").setView(DEFAULT_CENTER, DEFAULT_ZOOM);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);
    markersLayer = L.layerGroup().addTo(map);

    await refreshData({ isInitialLoad: true });

    setInterval(() => refreshData({ isInitialLoad: false }), REFRESH_INTERVAL_MS);
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  loadMap();
</script>

</body>
</html>
