<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Site Visit Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --ink: #0F1B2D;
    --surface: #16263D;
    --surface-line: #2A3B54;
    --paper: #EDEFF2;
    --paper-dim: #A8B4C4;
    --accent: #F5A623;

    --c-fresh: #2FA88A;
    --c-week1: #F5C244;
    --c-week2: #E8790C;
    --c-week3: #D0392B;
    --c-unvisited: #6B7A8F;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    min-height: 480px;
  }

  #mapWrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
  }

  #map {
    position: absolute;
    inset: 0;
  }

  .header {
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 8px;
    padding: 12px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--surface-line);
  }

  .header-controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 14px;
  }

  .header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .header .count {
    color: var(--paper-dim);
    font-size: 13px;
  }

  .legend {
    position: absolute;
    bottom: 22px;
    left: 18px;
    z-index: 500;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: 4px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.9;
    min-width: 168px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: 0 0 auto;
  }

  .status {
    position: absolute;
    inset: 0;
    z-index: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
  }

  .status-box {
    max-width: 380px;
  }

  .status-box h2 {
    font-size: 16px;
    margin: 0 0 8px;
    font-weight: 600;
  }

  .status-box p {
    margin: 0;
    color: var(--paper-dim);
    font-size: 14px;
    line-height: 1.5;
  }

  .status-box code {
    display: block;
    margin-top: 12px;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--accent);
    word-break: break-all;
    text-align: left;
  }

  .leaflet-popup-content-wrapper {
    background: var(--surface);
    color: var(--paper);
    border-radius: 4px;
  }
  .leaflet-popup-tip { background: var(--surface); }
  .leaflet-popup-content a { color: var(--accent); }
  .popup-title { font-weight: 600; margin-bottom: 2px; }
  .popup-priority { color: var(--paper-dim); font-size: 12px; margin-bottom: 6px; }
  .popup-location { font-size: 12px; color: var(--paper-dim); margin-bottom: 8px; }
  .popup-details {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--surface-line);
  }
  .popup-row {
    display: flex;
    gap: 6px;
    font-size: 12px;
    line-height: 1.4;
  }
  .popup-label {
    color: var(--paper-dim);
    flex: 0 0 auto;
    min-width: 90px;
  }
  .popup-value {
    color: var(--paper);
  }

  .filter-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    color: var(--paper);
    border-radius: 4px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .filter-toggle:hover { border-color: var(--accent); }
  .filter-badge {
    background: var(--accent);
    color: var(--ink);
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    padding: 1px 6px;
    display: none;
  }

  .filter-panel {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 600;
    width: 260px;
    max-width: calc(100% - 24px);
    max-height: calc(100% - 24px);
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: 4px;
    padding: 4px 14px 14px;
    display: none;
  }
  .filter-panel.open { display: block; }

  .filter-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0 6px;
    position: sticky;
    top: 0;
    background: var(--surface);
  }
  .filter-panel-header h3 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
  }
  .clear-filters {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    padding: 0;
  }

  .filter-group summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 0;
    list-style: none;
  }
  .filter-group summary::-webkit-details-marker { display: none; }
  .filter-group summary::before {
    content: "▸";
    display: inline-block;
    margin-right: 6px;
    color: var(--paper-dim);
  }
  .filter-group[open] summary::before { content: "▾"; }

  .filter-option {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 4px 0 4px 18px;
    color: var(--paper-dim);
  }
  .filter-option input { accent-color: var(--accent); }

  .match-mode {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--paper-dim);
    padding: 2px 0 8px 18px;
  }
  .match-mode label {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .match-mode input { accent-color: var(--accent); }

  .search-bar {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: 4px;
    padding: 4px 4px 4px 10px;
    width: 240px;
    max-width: calc(100% - 24px);
  }
  .search-bar input {
    flex: 1;
    background: none;
    border: none;
    color: var(--paper);
    font-size: 13px;
    outline: none;
    min-width: 0;
  }
  .search-bar input::placeholder { color: var(--paper-dim); }
  .search-bar button {
    background: var(--accent);
    color: var(--ink);
    border: none;
    border-radius: 3px;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 12px;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .search-bar button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .search-status {
    position: absolute;
    top: 56px;
    left: 12px;
    z-index: 500;
    font-size: 12px;
    color: var(--paper-dim);
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: 4px;
    padding: 6px 10px;
    max-width: calc(100% - 24px);
    display: none;
  }

  .color-by {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--paper-dim);
  }
  .color-by select {
    background: var(--surface);
    color: var(--paper);
    border: 1px solid var(--surface-line);
    border-radius: 4px;
    font-size: 12px;
    padding: 4px 6px;
  }

  .locate-button {
    position: absolute;
    bottom: 22px;
    right: 12px;
    z-index: 500;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    color: var(--paper);
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
  }
  .locate-button:hover { border-color: var(--accent); }
  .locate-button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  @media (max-width: 640px) {
    .header {
      padding: 14px 14px;
    }
    .header h1 {
      font-size: 19px;
    }
    .header-controls {
      width: 100%;
      justify-content: space-between;
      gap: 12px 16px;
    }
    .count {
      font-size: 14px;
    }
    .color-by {
      font-size: 14px;
    }
    .color-by select {
      font-size: 15px;
      padding: 8px 8px;
    }
    .filter-toggle {
      font-size: 15px;
      padding: 11px 16px; /* bigger tap target */
    }
    .filter-badge {
      font-size: 13px;
      padding: 2px 8px;
    }
    .search-bar {
      width: calc(100% - 24px);
      padding: 6px 6px 6px 14px;
    }
    .search-bar input {
      font-size: 16px; /* prevents iOS Safari auto-zoom on focus */
    }
    .search-bar button {
      font-size: 14px;
      padding: 12px 16px;
    }
    .search-status {
      font-size: 14px;
      padding: 8px 12px;
    }
    .filter-panel {
      width: calc(100% - 24px);
      padding: 6px 16px 16px;
    }
    .filter-panel-header h3 {
      font-size: 15px;
    }
    .filter-group summary {
      font-size: 15px;
      padding: 12px 0;
    }
    .filter-option {
      padding: 10px 0 10px 20px; /* bigger tap target */
      font-size: 16px;
    }
    .filter-option input,
    .match-mode input {
      width: 20px;
      height: 20px;
    }
    .match-mode {
      font-size: 14px;
    }
    .legend {
      font-size: 15px;
      padding: 14px 16px;
      max-width: calc(100% - 24px);
    }
    .legend-dot {
      width: 12px;
      height: 12px;
    }
    .clear-filters {
      font-size: 15px;
      padding: 6px 0; /* bigger tap target */
    }
    .status-box h2 {
      font-size: 18px;
    }
    .status-box p {
      font-size: 15px;
    }
    .locate-button {
      width: 48px;
      height: 48px;
      font-size: 20px;
    }
  }
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1>Site visits</h1>
    <div class="header-controls">
      <div class="color-by">
        <span>Color by</span>
        <select id="colorBySelect"></select>
      </div>
      <span class="count" id="pointCount"></span>
      <button class="filter-toggle" id="filterToggle">
        Filters <span class="filter-badge" id="filterBadge">0</span>
      </button>
    </div>
  </div>

  <div id="mapWrap">
    <div id="map"></div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search an address…" />
      <button id="searchButton">Go</button>
    </div>
    <div class="search-status" id="searchStatus"></div>

    <div class="filter-panel" id="filterPanel">
      <div class="filter-panel-header">
        <h3>Filter sites</h3>
        <button class="clear-filters" id="clearFilters">Clear all</button>
      </div>
      <div id="filterGroups"></div>
    </div>

    <div class="legend" id="legend" style="display:none;"></div>

    <button class="locate-button" id="locateButton" title="Center on my location">📍</button>

    <div class="status" id="status">
      <div class="status-box">
        <h2>Loading site visits…</h2>
        <p>Pulling the latest data from the reports database.</p>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ---- CONFIG -----------------------------------------------------------
  // Raw URL of the GitHub Gist that publishMapData keeps updated. Format:
  // https://gist.githubusercontent.com/USERNAME/GIST_ID/raw/FILENAME
  // (grab the exact URL from the gist page's "Raw" button on the file).
  const MAP_DATA_URL = "https://gist.githubusercontent.com/thonschke/9836a09704d9b338a76c6ad413912d32/raw/map-data.json";

  // Center the map roughly over your service area on first load.
  const DEFAULT_CENTER = [39.5, -75.5];
  const DEFAULT_ZOOM = 8;

  // How often the map re-fetches data on its own, in milliseconds.
  // No need to poll faster than publishMapData actually republishes.
  const REFRESH_INTERVAL_MS = 30 * 1000; // 30 seconds
  // -------------------------------------------------------------------------

  const PRIORITY_COLORS = {
    "< 1 week": "#2FA88A",
    "More than 1 week": "#F5C244",
    "More than 2 weeks": "#E8790C",
    "More than 3 weeks": "#D0392B",
    "Not Visited": "#6B7A8F",
  };
  const PRIORITY_ORDER = [
    "< 1 week",
    "More than 1 week",
    "More than 2 weeks",
    "More than 3 weeks",
    "Not Visited",
  ];

  // Filter categories shown in the panel. `getValues` returns an array since
  // a point can match more than one value in a category (e.g. multiple
  // trades on one report) — a point passes a category filter if it has ANY
  // selected value in that category. Categories combine with AND.
  // Defensively normalizes to an array whether the value came from a
  // current-shape gist (array) or a stale one published before the
  // multi_select fix (plain string). Without this, .forEach() on a raw
  // string throws — silently crashing buildFilterPanel before any pins or
  // the counter ever render, with no visible error.
  function toArray(v) {
    if (Array.isArray(v)) return v;
    if (v === null || v === undefined || v === "") return [];
    return [v];
  }

  const FILTER_DEFS = [
    { key: "priority", label: "Visit priority", getValues: (p) => [p.priority || "Unknown"], fixedOptions: PRIORITY_ORDER },
    { key: "trades", label: "Number of trades", getValues: (p) => [tradeCountBucket((p.trades || []).length)] },
    { key: "tradeType", label: "Trade", getValues: (p) => { const arr = toArray(p.trades); return arr.length ? arr : ["None listed"]; } },
    { key: "status", label: "Status of project", getValues: (p) => { const arr = toArray(p.status); return arr.length ? arr : ["Unknown"]; } },
    { key: "publicOrPrivate", label: "Public / private", getValues: (p) => { const arr = toArray(p.publicOrPrivate); return arr.length ? arr : ["Unknown"]; } },
    { key: "unionStatus", label: "Union status", getValues: (p) => { const arr = toArray(p.unionStatus); return arr.length ? arr : ["Unknown"]; } },
    { key: "state", label: "State", getValues: (p) => { const arr = toArray(p.state); return arr.length ? arr : ["Unknown"]; } },
    { key: "county", label: "County", getValues: (p) => { const arr = toArray(p.county); return arr.length ? arr : ["Unknown"]; } },
  ];

  const activeFilters = {};
  FILTER_DEFS.forEach((def) => (activeFilters[def.key] = new Set()));

  // Which category currently determines pin color. Defaults to priority,
  // since that has fixed, deliberately-chosen colors. Every other category
  // gets colors generated on the fly (see colorForValue below).
  let colorByKey = "priority";

  const statusEl = document.getElementById("status");
  const legendEl = document.getElementById("legend");
  const countEl = document.getElementById("pointCount");
  const filterToggleEl = document.getElementById("filterToggle");
  const filterPanelEl = document.getElementById("filterPanel");
  const filterGroupsEl = document.getElementById("filterGroups");
  const filterBadgeEl = document.getElementById("filterBadge");
  const clearFiltersEl = document.getElementById("clearFilters");
  const colorBySelectEl = document.getElementById("colorBySelect");
  const searchInputEl = document.getElementById("searchInput");
  const searchButtonEl = document.getElementById("searchButton");
  const searchStatusEl = document.getElementById("searchStatus");

  colorBySelectEl.innerHTML = FILTER_DEFS
    .map((def) => `<option value="${def.key}">${escapeHtml(def.label)}</option>`)
    .join("");
  colorBySelectEl.value = colorByKey;
  colorBySelectEl.addEventListener("change", () => {
    colorByKey = colorBySelectEl.value;
    applyFilters();
  });

  // Manual color overrides, checked before falling back to the
  // auto-generated hash color. Add more entries here as needed.
  const STATUS_COLOR_SCALE = ["#d73027", "#fc8d59", "#fee08b", "#d9ef8b", "#91cf60", "#1a9850"];
  const UNKNOWN_COLOR = "#9E9E9E";

  // Assumed order: array[0] = Public, array[1] = Private. Swap the two
  // values below if that's backwards for how your data actually reads.
  const PUBLIC_PRIVATE_COLORS = {
    Public: "#af8dc3",
    Private: "#7fbf7b",
  };

  function tradeCountBucket(count) {
    if (count === 0) return "No trades listed";
    if (count === 1) return "1 trade";
    if (count === 2) return "2 trades";
    return "3+ trades";
  }

  const TRADE_COUNT_COLORS = {
    "No trades listed": "#9E9E9E",
    "1 trade": "#4C9BE8",
    "2 trades": "#F5A623",
    "3+ trades": "#D0392B",
  };

  function unionStatusColor(value) {
    // Matches by keyword rather than exact string, so this doesn't break if
    // the option is phrased slightly differently (e.g. "Non-Union" vs
    // "non union" vs "Nonunion"). Checked in this order deliberately —
    // "mixed" first, since some labels contain both "mixed" and "non" as
    // substrings (e.g. "Mixed / Non-Union"), and mixed should win that case.
    const v = (value || "").toLowerCase();
    if (v.includes("mixed")) return "#F5D90A"; // saturated yellow
    if (v.includes("non")) return "#D0392B"; // red
    if (v.includes("union")) return "#2FA88A"; // green
    return UNKNOWN_COLOR;
  }

  function statusColor(value) {
    // Status values are formatted like "2 - Structure up - ...", so pull
    // the leading number (0-5) and index into the scale.
    const match = /^(\d+)/.exec(value || "");
    if (match) {
      const idx = parseInt(match[1], 10);
      if (idx >= 0 && idx < STATUS_COLOR_SCALE.length) return STATUS_COLOR_SCALE[idx];
    }
    return UNKNOWN_COLOR;
  }

  // Deterministic color for an arbitrary string — same value always gets
  // the same color across refreshes/sessions, without needing a hand-picked
  // palette for open-ended fields like State or County.
  const colorCache = new Map();
  function colorForValue(value, key) {
    if (value === "Unknown" || !value) return UNKNOWN_COLOR;
    if (key === "status") return statusColor(value);
    if (key === "publicOrPrivate") return PUBLIC_PRIVATE_COLORS[value] || UNKNOWN_COLOR;
    if (key === "unionStatus") return unionStatusColor(value);
    if (key === "trades") return TRADE_COUNT_COLORS[value] || UNKNOWN_COLOR;

    const cacheKey = `${key || ""}::${value}`;
    if (colorCache.has(cacheKey)) return colorCache.get(cacheKey);
    let hash = 0;
    for (let i = 0; i < value.length; i++) {
      hash = (hash * 31 + value.charCodeAt(i)) >>> 0;
    }
    const hue = hash % 360;
    const color = `hsl(${hue}, 65%, 55%)`;
    colorCache.set(cacheKey, color);
    return color;
  }

  function colorForPoint(point) {
    if (colorByKey === "priority") {
      return PRIORITY_COLORS[point.priority] || PRIORITY_COLORS["Not Visited"];
    }
    const def = FILTER_DEFS.find((d) => d.key === colorByKey);
    const values = def ? def.getValues(point) : [];
    const primary = values[0] || "Unknown";
    return colorForValue(primary, colorByKey);
  }

  function showError(title, detail) {
    statusEl.style.display = "flex";
    statusEl.innerHTML = `
      <div class="status-box">
        <h2>${title}</h2>
        <p>${detail}</p>
      </div>
    `;
  }

  function renderLegend(presentValues) {
    const isPriority = colorByKey === "priority";
    const orderedValues = isPriority
      ? PRIORITY_ORDER.filter((p) => presentValues.has(p))
      : Array.from(presentValues).sort();

    legendEl.innerHTML = orderedValues
      .map((v) => {
        const color = isPriority ? PRIORITY_COLORS[v] : colorForValue(v, colorByKey);
        return `
          <div class="legend-row">
            <span class="legend-dot" style="background:${color}"></span>
            <span>${escapeHtml(v)}</span>
          </div>`;
      })
      .join("");
    legendEl.style.display = "block";
  }

  // Excluded from the "Trade" filter's checkbox list specifically — these
  // are still counted in "Number of trades", just not selectable as a
  // trade-type filter, since the ask was to filter by the four physical
  // trades, not by contractor role.
  const TRADE_FILTER_EXCLUDED = new Set(["General Contractor", "Subcontractor"]);

  // AND = site must have ALL checked trades. OR = site must have ANY
  // checked trade. Only meaningful for the "tradeType" category.
  let tradeMatchMode = "OR";

  function buildFilterPanel(points) {
    filterGroupsEl.innerHTML = FILTER_DEFS.map((def) => {
      const seen = new Set(def.fixedOptions || []);
      points.forEach((p) => def.getValues(p).forEach((v) => seen.add(v)));
      if (def.key === "tradeType") {
        TRADE_FILTER_EXCLUDED.forEach((v) => seen.delete(v));
      }
      const options = Array.from(seen).sort();

      const rows = options
        .map((opt) => {
          const id = `f-${def.key}-${opt.replace(/[^a-z0-9]/gi, "_")}`;
          const checked = activeFilters[def.key].has(opt) ? "checked" : "";
          return `
            <label class="filter-option" for="${id}">
              <input type="checkbox" id="${id}" data-key="${def.key}" data-value="${escapeHtml(opt)}" ${checked} />
              ${escapeHtml(opt)}
            </label>`;
        })
        .join("");

      const matchModeToggle =
        def.key === "tradeType"
          ? `
            <div class="match-mode">
              <span>Match:</span>
              <label><input type="radio" name="tradeMatchMode" value="OR" ${tradeMatchMode === "OR" ? "checked" : ""} /> Any (OR)</label>
              <label><input type="radio" name="tradeMatchMode" value="AND" ${tradeMatchMode === "AND" ? "checked" : ""} /> All (AND)</label>
            </div>`
          : "";

      return `
        <details class="filter-group">
          <summary>${escapeHtml(def.label)}</summary>
          ${matchModeToggle}
          ${rows}
        </details>`;
    }).join("");

    filterGroupsEl.querySelectorAll("input[type=checkbox]").forEach((input) => {
      input.addEventListener("change", () => {
        const { key, value } = input.dataset;
        if (input.checked) {
          activeFilters[key].add(value);
        } else {
          activeFilters[key].delete(value);
        }
        updateFilterBadge();
        applyFilters();
      });
    });

    filterGroupsEl.querySelectorAll('input[name="tradeMatchMode"]').forEach((input) => {
      input.addEventListener("change", () => {
        tradeMatchMode = input.value;
        applyFilters();
      });
    });
  }

  function updateFilterBadge() {
    const total = Object.values(activeFilters).reduce((sum, set) => sum + set.size, 0);
    filterBadgeEl.textContent = String(total);
    filterBadgeEl.style.display = total > 0 ? "inline-block" : "none";
  }

  function pointMatchesFilters(point) {
    return FILTER_DEFS.every((def) => {
      const selected = activeFilters[def.key];
      if (selected.size === 0) return true; // no filter set in this category = show all
      const values = def.getValues(point);

      if (def.key === "tradeType" && tradeMatchMode === "AND") {
        // Site must have EVERY checked trade.
        return Array.from(selected).every((v) => values.includes(v));
      }
      // Default: site must have ANY checked value.
      return values.some((v) => selected.has(v));
    });
  }

  function applyFilters() {
    const filtered = allPoints.filter(pointMatchesFilters);
    renderPoints(filtered, { isFiltered: activeFilters && Object.values(activeFilters).some((s) => s.size > 0) });
  }

  filterToggleEl.addEventListener("click", () => {
    filterPanelEl.classList.toggle("open");
  });

  clearFiltersEl.addEventListener("click", () => {
    FILTER_DEFS.forEach((def) => activeFilters[def.key].clear());
    filterGroupsEl.querySelectorAll("input[type=checkbox]").forEach((input) => (input.checked = false));
    updateFilterBadge();
    applyFilters();
  });

  let allPoints = [];
  let map = null;
  let markersLayer = null;
  let searchMarker = null;
  let userLocationMarker = null;
  let hasFitBoundsOnce = false;

  async function searchAddress() {
    const query = searchInputEl.value.trim();
    if (!query) return;

    searchButtonEl.disabled = true;
    searchStatusEl.style.display = "block";
    searchStatusEl.textContent = "Searching…";

    try {
      // Nominatim: OpenStreetMap's free geocoding API — same data provider
      // as the map tiles, no API key required. Please keep searches to
      // deliberate, human-triggered lookups (not automated/bulk queries)
      // per their usage policy.
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`
      );
      if (!res.ok) throw new Error(`Search failed (${res.status})`);
      const results = await res.json();

      if (!results.length) {
        searchStatusEl.textContent = `No match found for "${query}".`;
        return;
      }

      const { lat, lon, display_name } = results[0];
      map.setView([parseFloat(lat), parseFloat(lon)], 15);

      if (searchMarker) map.removeLayer(searchMarker);
      searchMarker = L.marker([parseFloat(lat), parseFloat(lon)])
        .addTo(map)
        .bindPopup(escapeHtml(display_name))
        .openPopup();

      searchStatusEl.style.display = "none";
    } catch (err) {
      searchStatusEl.textContent = `Search failed: ${err.message}`;
    } finally {
      searchButtonEl.disabled = false;
    }
  }

  searchButtonEl.addEventListener("click", searchAddress);
  searchInputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") searchAddress();
  });

  const locateButtonEl = document.getElementById("locateButton");

  function describeGeoError(err) {
    // Map numeric codes explicitly rather than relying on err.message, which
    // varies by browser/OS and isn't always informative.
    switch (err.code) {
      case err.PERMISSION_DENIED:
        return "Location access was denied. Check Settings → Privacy & Security → Location Services on iPhone, or your browser's site permissions.";
      case err.POSITION_UNAVAILABLE:
        return "Your device couldn't determine a location right now (code 2 — position unavailable).";
      case err.TIMEOUT:
        return "Location request timed out (code 3).";
      default:
        return `Couldn't get your location (code ${err.code}): ${err.message}`;
    }
  }

  function placeUserLocation(lat, lng) {
    map.setView([lat, lng], 14);
    if (userLocationMarker) map.removeLayer(userLocationMarker);
    userLocationMarker = L.circleMarker([lat, lng], {
      radius: 8,
      color: "#FFFFFF",
      weight: 2,
      fillColor: "#4C9BE8",
      fillOpacity: 1,
    })
      .addTo(map)
      .bindPopup("Your location")
      .openPopup();
  }

  locateButtonEl.addEventListener("click", () => {
    if (!navigator.geolocation) {
      searchStatusEl.style.display = "block";
      searchStatusEl.textContent = "Geolocation isn't supported by this browser.";
      return;
    }

    locateButtonEl.disabled = true;

    // First attempt: low accuracy (WiFi/cell-based), which resolves faster
    // and more reliably than forcing the GPS chip — iOS in particular tends
    // to time out on enableHighAccuracy indoors or with a weak signal.
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        placeUserLocation(pos.coords.latitude, pos.coords.longitude);
        locateButtonEl.disabled = false;
      },
      (err) => {
        if (err.code === err.TIMEOUT) {
          // Retry once with a longer timeout before giving up.
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              placeUserLocation(pos.coords.latitude, pos.coords.longitude);
              locateButtonEl.disabled = false;
            },
            (err2) => {
              searchStatusEl.style.display = "block";
              searchStatusEl.textContent = describeGeoError(err2);
              locateButtonEl.disabled = false;
            },
            { enableHighAccuracy: false, timeout: 20000, maximumAge: 60000 }
          );
          return;
        }
        searchStatusEl.style.display = "block";
        searchStatusEl.textContent = describeGeoError(err);
        locateButtonEl.disabled = false;
      },
      { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
    );
  });

  async function fetchPoints() {
    const res = await fetch(`${MAP_DATA_URL}?t=${Date.now()}`); // cache-bust so we don't see a stale cached copy right after a scheduled update
    if (!res.ok) {
      throw new Error(`Server responded with status ${res.status}`);
    }
    return (await res.json()) || [];
  }

  function popupRow(label, values) {
    const arr = toArray(values);
    if (arr.length === 0) return "";
    return `
      <div class="popup-row">
        <span class="popup-label">${escapeHtml(label)}</span>
        <span class="popup-value">${arr.map(escapeHtml).join(", ")}</span>
      </div>`;
  }

  function formatLastVisited(isoDate) {
    if (!isoDate) return "No visits recorded";
    const d = new Date(isoDate);
    if (isNaN(d.getTime())) return "No visits recorded";
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  function buildPopupHtml(point) {
    const locationParts = [point.county, point.state]
      .flatMap((v) => toArray(v))
      .filter(Boolean);

    return `
      <div class="popup-title">${escapeHtml(point.name || "Untitled")}</div>
      <div class="popup-priority">Last visited: ${escapeHtml(formatLastVisited(point.lastVisitedDate))}</div>
      ${locationParts.length ? `<div class="popup-location">${escapeHtml(locationParts.join(", "))}</div>` : ""}
      <div class="popup-details">
        ${popupRow("Trade", (point.trades || []).filter((t) => !TRADE_FILTER_EXCLUDED.has(t)))}
        ${popupRow("Status", point.status)}
        ${popupRow("Public/Private", point.publicOrPrivate)}
        ${popupRow("Union status", point.unionStatus)}
      </div>
      ${point.url ? `<a href="${point.url}" target="_blank" rel="noopener">Open in Notion →</a>` : ""}
    `;
  }

  function renderPoints(points, { isFiltered } = {}) {
    markersLayer.clearLayers();

    const bounds = [];
    const presentValues = new Set();
    const colorDef = FILTER_DEFS.find((d) => d.key === colorByKey);

    points.forEach((point) => {
      const color = colorForPoint(point);
      const legendValue =
        colorByKey === "priority"
          ? (PRIORITY_COLORS[point.priority] ? point.priority : "Not Visited")
          : ((colorDef ? colorDef.getValues(point) : [])[0] || "Unknown");
      presentValues.add(legendValue);

      const marker = L.circleMarker([point.lat, point.lng], {
        radius: 7,
        color: "#0F1B2D",
        fillColor: color,
        fillOpacity: 1,
        weight: 1.5,
      });

      marker.bindPopup(buildPopupHtml(point));

      marker.addTo(markersLayer);
      bounds.push([point.lat, point.lng]);
    });

    countEl.textContent = isFiltered
      ? `${points.length} of ${allPoints.length} sites`
      : `${points.length} site${points.length === 1 ? "" : "s"}`;
    renderLegend(presentValues);

    // Only auto-fit the view the FIRST time points load — on later refreshes
    // or filter changes, leave the view alone so we don't yank the map out
    // from under someone who's currently panned/zoomed in on an area.
    if (!hasFitBoundsOnce && bounds.length > 0) {
      if (bounds.length > 1) {
        map.fitBounds(bounds, { padding: [40, 40] });
      } else {
        map.setView(bounds[0], 13);
      }
      hasFitBoundsOnce = true;
    }
  }

  async function refreshData({ isInitialLoad } = {}) {
    let points;
    try {
      points = await fetchPoints();
    } catch (err) {
      if (isInitialLoad) {
        showError(
          "Couldn't load site visits",
          `The map couldn't reach the data source. Details: ${err.message}`
        );
      } else {
        // Don't blow away an already-working map over a transient refresh
        // failure — just note it quietly and try again next interval.
        console.warn("Map refresh failed:", err);
      }
      return;
    }

    if (isInitialLoad && points.length === 0) {
      showError(
        "No site visits to show",
        "The data source returned no records with a location set."
      );
      return;
    }

    if (isInitialLoad) {
      statusEl.style.display = "none";
    }

    allPoints = points;
    buildFilterPanel(allPoints); // rebuild options in case new values showed up
    applyFilters();
  }

  async function loadMap() {
    if (!MAP_DATA_URL || MAP_DATA_URL.startsWith("REPLACE_WITH")) {
      showError(
        "Map data URL not set",
        "Open this file and set MAP_DATA_URL to the gist's raw URL."
      );
      return;
    }

    map = L.map("map").setView(DEFAULT_CENTER, DEFAULT_ZOOM);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);
    markersLayer = L.layerGroup().addTo(map);

    await refreshData({ isInitialLoad: true });

    setInterval(() => refreshData({ isInitialLoad: false }), REFRESH_INTERVAL_MS);
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  loadMap();
</script>

</body>
</html>
